<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRGRAM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #17212b; color: white; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #242f3d; border-radius: 16px; padding: 20px; margin: 10px 0; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: none; font-size: 16px; }
        input { background: #2b3947; color: white; }
        button { background: #5288c1; color: white; cursor: pointer; }
        .message { padding: 10px 15px; margin: 8px 0; border-radius: 18px; max-width: 80%; }
        .message.outgoing { background: #5288c1; margin-left: auto; }
        .message.incoming { background: #2b3947; }
        .hidden { display: none; }
        .flex { display: flex; gap: 10px; align-items: center; }
        .messages-container { height: 60vh; overflow-y: auto; padding: 10px; }
        .input-area { display: flex; gap: 10px; position: fixed; bottom: 20px; left: 20px; right: 20px; max-width: 600px; margin: 0 auto; }
        .input-area input { flex: 1; margin: 0; }
        .input-area button { width: auto; padding: 12px 20px; }
        .error { color: #ff6b6b; font-size: 14px; margin: 10px 0; }
    </style>
</head>
<body>
<div class="container">
    <div id="authScreen">
        <div class="card">
            <h2>WRGRAM ☁️</h2>
            <div class="flex" style="margin: 15px 0;">
                <button id="loginTabBtn" style="background:#5288c1">Вход</button>
                <button id="registerTabBtn">Регистрация</button>
            </div>
            <div id="loginForm">
                <input type="text" id="loginUsername" placeholder="Username">
                <input type="password" id="loginPassword" placeholder="Пароль">
                <button id="loginBtn">Войти</button>
                <div id="loginError" class="error"></div>
            </div>
            <div id="registerForm" class="hidden">
                <input type="text" id="regUsername" placeholder="Username">
                <input type="text" id="regDisplayName" placeholder="Отображаемое имя">
                <input type="password" id="regPassword" placeholder="Пароль">
                <button id="registerBtn">Зарегистрироваться</button>
                <div id="registerError" class="error"></div>
            </div>
        </div>
    </div>
    
    <div id="chatScreen" class="hidden">
        <div class="card">
            <div class="flex">
                <span id="userName"></span>
                <button id="logoutBtn" style="margin-left:auto; background:#d32f2f;">Выйти</button>
            </div>
        </div>
        <div class="card">
            <h3>Чаты</h3>
            <div id="chatsContainer">
                <button onclick="openChat('test', 'Тестовый собеседник')">📩 Тестовый чат</button>
            </div>
        </div>
        <div id="chatArea" class="hidden">
            <div class="flex" style="margin-bottom:12px;">
                <button id="backBtn" style="width:auto;">← Назад</button>
                <span id="chatPartnerName"></span>
            </div>
            <div id="messagesContainer" class="messages-container"></div>
            <div class="input-area">
                <input type="text" id="msgInput" placeholder="Сообщение...">
                <button id="sendBtn">→</button>
            </div>
        </div>
    </div>
</div>

<script>
const API_URL = 'https://d5d2kuo8dn88fsigd340.kr8f6hld.apigw.yandexcloud.net';

let currentUser = null;
let currentChatId = null;

// Регистрация
document.getElementById('registerBtn').onclick = async () => {
    const username = document.getElementById('regUsername').value;
    const displayName = document.getElementById('regDisplayName').value;
    const password = document.getElementById('regPassword').value;
    
    const errorDiv = document.getElementById('registerError');
    errorDiv.textContent = 'Отправка...';
    
    try {
        const res = await fetch(`${API_URL}/auth`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                action: 'register',
                username: username,
                display_name: displayName,
                password: password
            })
        });
        const data = await res.json();
        
        if (data.success) {
            errorDiv.style.color = '#4caf50';
            errorDiv.textContent = '✅ Регистрация успешна! Теперь войдите.';
            document.getElementById('regUsername').value = '';
            document.getElementById('regDisplayName').value = '';
            document.getElementById('regPassword').value = '';
        } else {
            errorDiv.style.color = '#ff6b6b';
            errorDiv.textContent = '❌ Ошибка: ' + JSON.stringify(data);
        }
    } catch (err) {
        errorDiv.style.color = '#ff6b6b';
        errorDiv.textContent = '❌ Ошибка соединения: ' + err.message;
    }
};

// Вход
document.getElementById('loginBtn').onclick = async () => {
    const username = document.getElementById('loginUsername').value;
    const password = document.getElementById('loginPassword').value;
    
    const errorDiv = document.getElementById('loginError');
    errorDiv.textContent = 'Отправка...';
    
    try {
        const res = await fetch(`${API_URL}/auth`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                action: 'login',
                username: username,
                password: password
            })
        });
        const data = await res.json();
        
        if (data.success) {
            currentUser = data;
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('chatScreen').classList.remove('hidden');
            document.getElementById('userName').innerText = data.display_name || data.username;
            errorDiv.textContent = '';
        } else {
            errorDiv.style.color = '#ff6b6b';
            errorDiv.textContent = '❌ Ошибка входа: ' + (data.error || 'неверные данные');
        }
    } catch (err) {
        errorDiv.style.color = '#ff6b6b';
        errorDiv.textContent = '❌ Ошибка соединения: ' + err.message;
    }
};

// Открыть чат
window.openChat = (chatId, name) => {
    currentChatId = chatId;
    document.querySelector('#chatScreen > .card').classList.add('hidden');
    document.getElementById('chatArea').classList.remove('hidden');
    document.getElementById('chatPartnerName').innerText = name;
    loadMessages();
};

// Загрузка сообщений
async function loadMessages() {
    try {
        const res = await fetch(`${API_URL}/get?chat_id=${currentChatId}`);
        const data = await res.json();
        const container = document.getElementById('messagesContainer');
        if (data.messages) {
            container.innerHTML = data.messages.map(m => `
                <div class="message ${m.sender_id === currentUser?.user_id ? 'outgoing' : 'incoming'}">
                    ${m.text}
                    <div style="font-size:10px; opacity:0.6;">${new Date(m.created_at * 1000).toLocaleTimeString()}</div>
                </div>
            `).join('');
        }
    } catch (err) {
        console.error('load error', err);
    }
}

// Отправка
document.getElementById('sendBtn').onclick = async () => {
    const text = document.getElementById('msgInput').value;
    if (!text || !currentChatId) return;
    
    try {
        await fetch(`${API_URL}/send`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                chat_id: currentChatId,
                sender_id: currentUser?.user_id,
                text: text
            })
        });
        document.getElementById('msgInput').value = '';
        loadMessages();
    } catch (err) {
        console.error('send error', err);
    }
};

// Назад
document.getElementById('backBtn').onclick = () => {
    document.querySelector('#chatScreen > .card').classList.remove('hidden');
    document.getElementById('chatArea').classList.add('hidden');
};

// Выход
document.getElementById('logoutBtn').onclick = () => {
    localStorage.clear();
    location.reload();
};

// Переключение табов
document.getElementById('loginTabBtn').onclick = () => {
    document.getElementById('loginForm').classList.remove('hidden');
    document.getElementById('registerForm').classList.add('hidden');
};
document.getElementById('registerTabBtn').onclick = () => {
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('registerForm').classList.remove('hidden');
};
</script>
</body>
</html>
